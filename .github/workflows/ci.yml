name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: Lint, type-check and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --group dev
      - name: Ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Mypy
        run: uv run mypy
      - name: Tests (incl. SQL on FHIR conformance suite)
        run: uv run pytest --junitxml=pytest.xml
      - name: Build packages
        run: |
          for p in packages/*/; do uv build --out-dir dist "$p"; done
          ls -l dist

  dbt:
    name: dbt project compiles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --group dbt
      - name: dbt deps + parse
        working-directory: dbt
        env:
          DBT_PROFILES_DIR: ${{ github.workspace }}/dbt
          KINDLING_DUCKDB: ${{ runner.temp }}/ci.duckdb
        run: |
          uv run dbt deps
          uv run dbt parse

  compose:
    name: Compose file is valid
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f stack/compose.yaml --profile full config --quiet
