[project]
name = "kindling-workspace"
version = "0.0.0"
description = "Development workspace for the kindling-* packages."
requires-python = ">=3.11"
dependencies = [
  "kindling-health",
  "kindling-synthea",
  "kindling-fhir-load",
  "kindling-bulk",
  "kindling-sof",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-httpserver>=1.0",
  "ruff>=0.6",
  "mypy>=1.10",
]
dbt = [
  "dbt-core>=1.10.5,<2",
  "dbt-duckdb>=1.9",
]
docs = [
  "mkdocs-material>=9.5",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
kindling-health = { workspace = true }
kindling-synthea = { workspace = true }
kindling-fhir-load = { workspace = true }
kindling-bulk = { workspace = true }
kindling-sof = { workspace = true }

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["dbt/dbt_packages", "dbt/target"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "SIM108", "E501"]  # formatter owns line length

[tool.ruff.lint.per-file-ignores]
"packages/kindling-sof/src/kindling_sof/fhirpath.py" = ["N802"]

[tool.pytest.ini_options]
testpaths = ["packages"]
addopts = "-q --import-mode=importlib"
markers = ["integration: needs a running FHIR server (KINDLING_FHIR_URL)"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
packages = ["kindling_sof", "kindling_synthea", "kindling_fhir_load", "kindling_bulk", "kindling_health"]
