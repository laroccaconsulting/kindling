[project]
name = "kindling-fhir-load"
version = "0.1.0"
description = "Load FHIR transaction bundles (e.g. Synthea output) into any FHIR R4 server, in dependency order."
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "LaRocca Consulting" }]
requires-python = ">=3.11"
dependencies = ["httpx>=0.27"]
keywords = ["fhir", "synthea", "hapi", "healthcare", "etl"]

[project.urls]
Homepage = "https://github.com/laroccaconsulting/kindling"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kindling_fhir_load"]
