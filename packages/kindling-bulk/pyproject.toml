[project]
name = "kindling-bulk"
version = "0.1.0"
description = "FHIR Bulk Data ($export) client: kick off, poll, and download NDJSON."
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "LaRocca Consulting" }]
requires-python = ">=3.11"
dependencies = ["httpx>=0.27"]
keywords = ["fhir", "bulk-data", "export", "ndjson", "healthcare"]

[project.urls]
Homepage = "https://github.com/laroccaconsulting/kindling"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kindling_bulk"]
