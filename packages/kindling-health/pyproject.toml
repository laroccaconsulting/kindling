[project]
name = "kindling-health"
version = "0.1.0"
description = "Kindling: open-source healthcare tools, wired together. CLI and pipeline orchestrator."
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "LaRocca Consulting" }]
requires-python = ">=3.11"
dependencies = [
  "kindling-synthea",
  "kindling-fhir-load",
  "kindling-bulk",
  "kindling-sof",
  "httpx>=0.27",
]
keywords = ["fhir", "synthea", "tuva", "dbt", "healthcare", "interoperability"]

[project.optional-dependencies]
dbt = ["dbt-core>=1.10.5,<2", "dbt-duckdb>=1.9"]

[project.urls]
Homepage = "https://github.com/laroccaconsulting/kindling"

[project.scripts]
kindling = "kindling_health.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kindling_health"]
