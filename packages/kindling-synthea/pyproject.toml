[project]
name = "kindling-synthea"
version = "0.1.0"
description = "Run a pinned Synthea release reproducibly from Python."
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "LaRocca Consulting" }]
requires-python = ">=3.11"
dependencies = []
keywords = ["synthea", "fhir", "synthetic-data", "healthcare"]

[project.urls]
Homepage = "https://github.com/laroccaconsulting/kindling"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kindling_synthea"]
