[project]
name = "kindling-sof"
version = "0.1.0"
description = "SQL on FHIR v2 ViewDefinition runner: FHIR NDJSON to DuckDB and Parquet."
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "LaRocca Consulting" }]
requires-python = ">=3.11"
dependencies = ["duckdb>=1.1", "pyarrow>=15"]
keywords = ["fhir", "sql-on-fhir", "viewdefinition", "duckdb", "healthcare"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Healthcare Industry",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

[project.urls]
Homepage = "https://github.com/laroccaconsulting/kindling"

[project.scripts]
kindling-sof = "kindling_sof.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kindling_sof"]
