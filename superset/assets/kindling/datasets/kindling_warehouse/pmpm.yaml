table_name: pmpm
main_dttm_col: null
description: Medical paid per member per month by year (2016-2025).
default_endpoint: null
offset: 0
cache_timeout: null
schema: main
sql: with mm as (select substr(year_month, 1, 4) as year, count(*) as member_months from core.member_month
  group by 1), paid as (select cast(year(claim_start_date) as varchar) as year, sum(paid_amount) as paid
  from core.medical_claim group by 1) select mm.year, mm.member_months, coalesce(paid.paid, 0) as paid,
  coalesce(paid.paid, 0) / mm.member_months as pmpm from mm left join paid on mm.year = paid.year where
  mm.year between '2016' and '2025'
